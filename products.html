<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMM Super Market - Products</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#f5f6f7;color:#111827}
.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:#181a1d;color:white;z-index:100}
.logoBox{height:90px;display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid #2d3035}
.logo{width:48px;height:48px;border-radius:50%;background:#f97316;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:bold}
.logoText strong{display:block;font-size:15px}.logoText span{font-size:10px;color:#9ca3af}
.nav{padding:18px 12px}.nav a{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:6px;color:#d1d5db;text-decoration:none;border-radius:8px;font-size:14px}
.nav a:hover,.nav a.active{background:#26292d;color:white}.nav a.active{border-left:3px solid #f97316}
.navIcon{width:24px;text-align:center;font-size:17px}
.logout{position:absolute;bottom:18px;left:12px;right:12px}.logout a{display:flex;align-items:center;gap:12px;color:#d1d5db;text-decoration:none;padding:12px 14px;border-radius:8px}
.main{margin-left:230px;min-height:100vh}
.topbar{height:70px;background:white;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.pageTitle h1{font-size:21px}.pageTitle p{font-size:12px;color:#6b7280;margin-top:4px}
.topRight{display:flex;align-items:center;gap:18px}.clock{font-size:13px;color:#6b7280}
.user{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:bold}.userDot{width:34px;height:34px;border-radius:50%;background:#f97316;color:white;display:flex;align-items:center;justify-content:center}
.content{padding:28px}
.toolbar{display:flex;gap:12px;margin-bottom:20px}
.search{flex:1;padding:13px 15px;border:1px solid #d1d5db;border-radius:8px;background:white;font-size:14px;outline:none}
.search:focus{border-color:#f97316}
.btn{border:0;border-radius:8px;padding:12px 20px;background:#f97316;color:white;font-weight:bold;cursor:pointer}
.btn:hover{background:#ea580c}
.panel{background:white;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;color:#6b7280;font-size:11px;text-align:left;padding:14px;border-bottom:1px solid #e5e7eb}
td{padding:14px;border-bottom:1px solid #f0f0f0;font-size:13px}
.name{font-weight:bold}.barcode{color:#9ca3af;font-size:11px;margin-top:3px}
.price{font-weight:bold}.stock{font-weight:bold}.low{color:#dc2626}.good{color:#16a34a}
@media(max-width:750px){
.sidebar{width:65px}.logoBox{justify-content:center;padding:10px}.logoText{display:none}
.nav a{justify-content:center;padding:13px 5px}.nav a span:not(.navIcon){display:none}
.logout{left:7px;right:7px}.logout a{justify-content:center}.logout a span{display:none}
.main{margin-left:65px}.topbar{padding:0 15px}.clock{display:none}.content{padding:18px}
.toolbar{flex-direction:column}
}
</style>
</head>

<body>

<aside class="sidebar">
<div class="logoBox">
<div class="logo">M</div>
<div class="logoText"><strong>MMM SUPER MARKET</strong><span>POINT OF SALE</span></div>
</div>

<nav class="nav">
<a href="dashboard.html"><span class="navIcon">▦</span><span>Dashboard</span></a>
<a href="sales.html"><span class="navIcon">＋</span><span>New Sale</span></a>
<a href="products.html" class="active"><span class="navIcon">▤</span><span>Products</span></a>
<a href="stock.html"><span class="navIcon">▥</span><span>Stock</span></a>
<a href="customers.html"><span class="navIcon">♙</span><span>Customers</span></a>
<a href="sales-history.html"><span class="navIcon">◷</span><span>Sales History</span></a>
<a href="reports.html"><span class="navIcon">▥</span><span>Reports</span></a>
</nav>

<div class="logout">
<a href="MMM Super Market Login.html"><span class="navIcon">↪</span><span>Logout</span></a>
</div>
</aside>

<main class="main">

<header class="topbar">
<div class="pageTitle">
<h1>Products</h1>
<p>Manage supermarket products</p>
</div>

<div class="topRight">
<div class="clock" id="clock"></div>
<div class="user"><div class="userDot">M</div>Administrator</div>
</div>
</header>

<section class="content">

<div class="toolbar">
<input id="search" class="search" placeholder="Search product name or barcode..." oninput="renderProducts()">
</div>

<div class="panel">
<div class="tableWrap">
<table>
<thead>
<tr>
<th>PRODUCT</th>
<th>BARCODE</th>
<th>PRICE</th>
<th>STOCK</th>
</tr>
</thead>
<tbody id="productTable"></tbody>
</table>
</div>
</div>

</section>
</main>

<script>
function getProducts(){
try{return JSON.parse(localStorage.getItem("mmm_products"))||[]}
catch(e){return []}
}

function money(n){
return Number(n||0).toLocaleString("en-LK",{minimumFractionDigits:2,maximumFractionDigits:2})
}

function esc(v){
return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")
}

function renderProducts(){

const search=document.getElementById("search").value.toLowerCase().trim();
const products=getProducts();

const list=products.filter(p=>
String(p.name||"").toLowerCase().includes(search)||
String(p.barcode||"").toLowerCase().includes(search)||
String(p.id||"").toLowerCase().includes(search)
);

const table=document.getElementById("productTable");

if(!list.length){
table.innerHTML='<tr><td colspan="4" style="text-align:center;padding:35px;color:#9ca3af">No products found.</td></tr>';
return;
}

table.innerHTML=list.map(p=>`
<tr>
<td>
<div class="name">${esc(p.name)}</div>
<div class="barcode">${esc(p.id||"")}</div>
</td>
<td>${esc(p.barcode||"-")}</td>
<td class="price">Rs. ${money(p.price)}</td>
<td class="stock ${Number(p.stock)<=10?"low":"good"}">${Number(p.stock||0)}</td>
</tr>
`).join("");
}

function clock(){
document.getElementById("clock").textContent=new Date().toLocaleTimeString();
}

document.addEventListener("DOMContentLoaded",()=>{
renderProducts();
clock();
setInterval(clock,1000);
});
</script>

</body>
</html>
