<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMM Super Market - Customers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:230px;
    height:100vh;
    background:#111827;
    color:white;
    padding:20px 14px;
    z-index:1000;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-circle{
    width:58px;
    height:58px;
    background:#2563eb;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:auto;
    font-size:19px;
    font-weight:bold;
}

.logo h2{
    font-size:19px;
    margin-top:10px;
}

.menu-title{
    color:#9ca3af;
    font-size:12px;
    text-transform:uppercase;
    margin:0 10px 10px;
    font-weight:bold;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#d1d5db;
    text-decoration:none;
    padding:13px 12px;
    margin-bottom:5px;
    border-radius:8px;
    font-size:14px;
    transition:.2s;
}

.menu a:hover,
.menu a.active{
    background:#2563eb;
    color:white;
}

.logout{
    position:absolute;
    left:14px;
    right:14px;
    bottom:20px;
}

.logout a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:#dc2626;
    color:white;
    padding:12px;
    border-radius:8px;
    text-decoration:none;
}

    .logout a:hover{
    background:#7f1d1d;
    color:white;
}

/* MAIN */
.main{
    margin-left:230px;
    min-height:100vh;
}

/* TOPBAR */
.topbar{
    height:70px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    border-bottom:1px solid #e5e7eb;
}

.topbar h1{
    font-size:22px;
}

.user{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#dbeafe;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* CONTENT */
.content{
    padding:30px;
}

/* PAGE HEADER */
.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.page-header h2{
    font-size:24px;
}

.page-header p{
    color:#6b7280;
    margin-top:5px;
}

.add-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:11px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:hover{
    background:#1d4ed8;
}

/* STAT */
.stat-card{
    background:white;
    border-radius:12px;
    padding:20px;
    width:250px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    margin-bottom:25px;
}

.stat-icon{
    width:42px;
    height:42px;
    background:#dbeafe;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    margin-bottom:12px;
}

.stat-card h3{
    font-size:25px;
    margin-bottom:5px;
}

.stat-card p{
    color:#6b7280;
    font-size:14px;
}

/* TABLE CARD */
.table-card{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    overflow:hidden;
}

/* SEARCH */
.search-area{
    padding:20px;
    border-bottom:1px solid #e5e7eb;
}

.search-input{
    width:100%;
    max-width:450px;
    padding:12px 14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.search-input:focus{
    border-color:#2563eb;
}

/* TABLE */
.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

thead{
    background:#f9fafb;
}

th{
    text-align:left;
    padding:15px 20px;
    font-size:13px;
    color:#6b7280;
    text-transform:uppercase;
}

td{
    padding:16px 20px;
    border-top:1px solid #f1f5f9;
    font-size:14px;
}

.customer-name{
    font-weight:bold;
}

.customer-id{
    color:#6b7280;
}

.phone{
    color:#374151;
}

.email{
    color:#6b7280;
}

/* ACTION BUTTONS */
.action-buttons{
    display:flex;
    gap:7px;
}

.edit-btn{
    background:#dbeafe;
    color:#1d4ed8;
    border:none;
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
}

.delete-btn{
    background:#fee2e2;
    color:#dc2626;
    border:none;
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
}

.edit-btn:hover{
    background:#bfdbfe;
}

.delete-btn:hover{
    background:#fecaca;
}

/* EMPTY */
.empty{
    text-align:center;
    padding:50px;
    color:#6b7280;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    align-items:center;
    justify-content:center;
    z-index:2000;
}

.modal-box{
    width:430px;
    max-width:92%;
    background:white;
    border-radius:12px;
    padding:25px;
}

.modal-box h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold;
}

.form-group input{
    width:100%;
    padding:11px 12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:14px;
}

.form-group input:focus{
    border-color:#2563eb;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.cancel-btn{
    border:none;
    background:#e5e7eb;
    padding:10px 17px;
    border-radius:8px;
    cursor:pointer;
}

.save-btn{
    border:none;
    background:#2563eb;
    color:white;
    padding:10px 17px;
    border-radius:8px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){

    .sidebar{
        width:65px;
        padding:15px 8px;
    }

    .logo h2,
    .menu-title,
    .menu a span:last-child{
        display:none;
    }

    .logo-circle{
        width:45px;
        height:45px;
        font-size:14px;
    }

    .menu a{
        justify-content:center;
        padding:13px 5px;
    }

    .logout a span:last-child{
        display:none;
    }

    .logout a{
        padding:12px 5px;
    }

    .main{
        margin-left:65px;
    }
}

@media(max-width:600px){

    .topbar{
        padding:0 15px;
    }

    .topbar h1{
        font-size:18px;
    }

    .content{
        padding:15px;
    }

    .page-header{
        align-items:flex-start;
        gap:10px;
    }

    .page-header h2{
        font-size:20px;
    }

    .add-btn{
        padding:10px 13px;
        white-space:nowrap;
    }

    .stat-card{
        width:100%;
    }

    th,
    td{
        padding:12px;
        white-space:nowrap;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<aside class="sidebar">

    <div class="logo">
        <div class="logo-circle">MMM</div>
        <h2>MMM Super Market</h2>
    </div>

    <div class="menu-title">Main Menu</div>

    <div class="menu">

        <a href="sales.html">
            <span>🛒</span>
            <span>New Sale</span>
        </a>

        <a href="products.html">
            <span>📦</span>
            <span>Products</span>
        </a>

        <a href="stock.html">
            <span>📊</span>
            <span>Stock</span>
        </a>

        <a href="customers.html" class="active">
            <span>👥</span>
            <span>Customers</span>
        </a>

        <a href="sales-history.html">
            <span>💰</span>
            <span>Sales</span>
        </a>

        <a href="reports.html">
            <span>📈</span>
            <span>Reports</span>
        </a>

        <a href="dashboard.html">
            <span>🏠</span>
            <span>Dashboard</span>
        </a>

    </div>

    <div class="logout">
        <a href="MMM Super Market Login.html">
            <span>🚪</span>
            <span>Logout</span>
        </a>
    </div>

</aside>


<!-- MAIN -->
<main class="main">

    <!-- TOPBAR -->
    <div class="topbar">

        <h1>Customer Management</h1>

        <div class="user">

            <div class="user-icon">A</div>

            <span>Admin</span>

        </div>

    </div>


    <div class="content">

        <!-- HEADER -->
        <div class="page-header">

            <div>

                <h2>Customers</h2>

                <p>
                    Manage your supermarket customers
                </p>

            </div>

            <button
                class="add-btn"
                onclick="openAddModal()"
            >
                + Add Customer
            </button>

        </div>


        <!-- STAT -->
        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <h3 id="customerCount">0</h3>

            <p>Total Customers</p>

        </div>


        <!-- TABLE -->
        <div class="table-card">

            <div class="search-area">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="🔍 Search customer by name, phone or email..."
                    oninput="displayCustomers()"
                >

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Customer Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="customerTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</main>


<!-- CUSTOMER MODAL -->
<div class="modal" id="customerModal">

    <div class="modal-box">

        <h2 id="modalTitle">
            Add Customer
        </h2>


        <div class="form-group">

            <label>
                Customer Name
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter customer name"
            >

        </div>


        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="text"
                id="customerPhone"
                placeholder="Enter phone number"
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="customerEmail"
                placeholder="Enter email address"
            >

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-btn"
                onclick="closeModal()"
            >
                Cancel
            </button>

            <button
                class="save-btn"
                onclick="saveCustomer()"
            >
                Save Customer
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   CUSTOMER DATA
========================= */

const DEFAULT_CUSTOMERS = [

    {
        id:1,
        name:"Walk-in Customer",
        phone:"",
        email:""
    }

];


/* =========================
   GET CUSTOMERS
========================= */

function getCustomers(){

    let customers =
        JSON.parse(
            localStorage.getItem("mmm_customers")
        );

    if(!customers){

        customers = DEFAULT_CUSTOMERS;

        localStorage.setItem(
            "mmm_customers",
            JSON.stringify(customers)
        );

    }

    return customers;

}


/* =========================
   SAVE CUSTOMERS
========================= */

function saveCustomers(customers){

    localStorage.setItem(
        "mmm_customers",
        JSON.stringify(customers)
    );

}


/* =========================
   DISPLAY CUSTOMERS
========================= */

function displayCustomers(){

    const customers = getCustomers();

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        customers.filter(customer => {

            return (

                String(customer.name || "")
                .toLowerCase()
                .includes(search)

                ||

                String(customer.phone || "")
                .toLowerCase()
                .includes(search)

                ||

                String(customer.email || "")
                .toLowerCase()
                .includes(search)

            );

        });


    const table =
        document.getElementById("customerTable");

    table.innerHTML = "";


    document.getElementById("customerCount")
        .textContent = customers.length;


    if(filtered.length === 0){

        table.innerHTML = `

            <tr>

                <td colspan="5">

                    <div class="empty">

                        No customers found

                    </div>

                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach(customer => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                <span class="customer-id">
                    #${customer.id}
                </span>
            </td>

            <td>

                <div class="customer-name">
                    ${escapeHTML(customer.name)}
                </div>

            </td>

            <td>

                <span class="phone">
                    ${customer.phone
                        ? escapeHTML(customer.phone)
                        : "—"}
                </span>

            </td>

            <td>

                <span class="email">
                    ${customer.email
                        ? escapeHTML(customer.email)
                        : "—"}
                </span>

            </td>

            <td>

                <div class="action-buttons">

                    <button
                        class="edit-btn"
                        onclick="editCustomer(${customer.id})"
                    >
                        ✏️ Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteCustomer(${customer.id})"
                    >
                        🗑️ Delete
                    </button>

                </div>

            </td>

        `;


        table.appendChild(row);

    });

}


/* =========================
   MODAL
========================= */

let editingCustomerId = null;


/* ADD */
function openAddModal(){

    editingCustomerId = null;

    document.getElementById("modalTitle")
        .textContent = "Add Customer";

    document.getElementById("customerName")
        .value = "";

    document.getElementById("customerPhone")
        .value = "";

    document.getElementById("customerEmail")
        .value = "";

    document.getElementById("customerModal")
        .style.display = "flex";

}


/* EDIT */
function editCustomer(id){

    const customers = getCustomers();

    const customer =
        customers.find(
            item => Number(item.id) === Number(id)
        );


    if(!customer){

        alert("Customer not found.");

        return;

    }


    editingCustomerId = id;


    document.getElementById("modalTitle")
        .textContent = "Edit Customer";


    document.getElementById("customerName")
        .value = customer.name || "";


    document.getElementById("customerPhone")
        .value = customer.phone || "";


    document.getElementById("customerEmail")
        .value = customer.email || "";


    document.getElementById("customerModal")
        .style.display = "flex";

}


/* =========================
   SAVE CUSTOMER
========================= */

function saveCustomer(){

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();

    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();

    const email =
        document
        .getElementById("customerEmail")
        .value
        .trim();


    if(name === ""){

        alert("Please enter customer name.");

        return;

    }


    let customers = getCustomers();


    /* EDIT */
    if(editingCustomerId !== null){

        const index =
            customers.findIndex(
                customer =>
                    Number(customer.id) ===
                    Number(editingCustomerId)
            );


        if(index !== -1){

            customers[index].name = name;

            customers[index].phone = phone;

            customers[index].email = email;

        }

    }


    /* ADD */
    else{

        const newId =
            customers.length > 0
            ? Math.max(
                ...customers.map(
                    customer =>
                        Number(customer.id)
                )
            ) + 1
            : 1;


        customers.push({

            id:newId,

            name:name,

            phone:phone,

            email:email

        });

    }


    saveCustomers(customers);

    closeModal();

    displayCustomers();

}


/* =========================
   DELETE CUSTOMER
========================= */

function deleteCustomer(id){

    const customers = getCustomers();

    const customer =
        customers.find(
            item =>
                Number(item.id) === Number(id)
        );


    if(!customer) return;


    /* PROTECT WALK-IN CUSTOMER */

    if(customer.name === "Walk-in Customer"){

        alert(
            "Walk-in Customer cannot be deleted."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "Delete customer \"" +
            customer.name +
            "\"?"
        );


    if(!confirmDelete) return;


    const updated =
        customers.filter(
            item =>
                Number(item.id) !== Number(id)
        );


    saveCustomers(updated);

    displayCustomers();

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

    document.getElementById("customerModal")
        .style.display = "none";

    editingCustomerId = null;

}


/* =========================
   OUTSIDE MODAL CLICK
========================= */

document.getElementById("customerModal")
.addEventListener("click",function(event){

    if(event.target === this){

        closeModal();

    }

});


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

displayCustomers();

</script>

</body>
</html>
