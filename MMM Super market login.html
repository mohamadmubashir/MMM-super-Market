<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MMM Super Market - Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#252a30,#4b5563);font-family:Arial,sans-serif}.box{width:min(390px,92vw);background:#fff;border-radius:14px;padding:30px;box-shadow:0 20px 60px #0005}.logo{text-align:center;font-size:30px;font-weight:900;color:#d97706}.sub{text-align:center;color:#777;margin:5px 0 25px}label{display:block;font-size:12px;color:#666;margin:12px 0 5px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:6px;background:#d97706;color:#fff;font-weight:700;cursor:pointer}.hint{text-align:center;font-size:11px;color:#888;margin-top:14px}</style></head><body><div class="box"><div class="logo">MMM</div><div class="sub">SUPER MARKET • POS</div><form onsubmit="login(event)"><label>Username</label><input id="u" value="admin" required><label>Password</label><input id="p" type="password" value="admin" required><button>Login</button></form><div class="hint">Demo login: admin / admin</div></div><script>function login(e){e.preventDefault();if(document.getElementById('u').value==='admin'&&document.getElementById('p').value==='admin'){location.href='dashboard.html'}else alert('Invalid username or password. Demo: admin / admin')}</script></body></html>
