<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MMM Super Market - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e8a61);
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #1e8a61;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 27px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #1e8a61;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #1e8a61;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #176b4c;
        }

        .error {
            display: none;
            margin-bottom: 15px;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 13px;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            text-align: center;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            MMM
        </div>

        <h1>MMM Super Market</h1>

        <div class="subtitle">
            Point of Sale System
        </div>

        <div class="error" id="error">
            Invalid username or password
        </div>

        <form id="loginForm">

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="footer">
            © 2026 MMM Super Market | POS System
        </div>

    </div>


    <script>

        document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");



            if (
                username === "muba" &&
                password === "1234"
            ) {

                // Save login
                localStorage.setItem(
                    "mmm_logged_user",
                    "muba"
                );

                // Go directly to Dashboard
                window.location.href = "sales.html";

            } else {

                error.style.display = "block";

            }

        });

    </script>

</body>
</html>
